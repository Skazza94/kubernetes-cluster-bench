# Build the image with ./images/build-vllm-aisim.sh.
# Set execution.image to its published registry digest.
backend: vllm
name: my-vllm
nodes:
  initiator: <decode-node>
  target: <prefill-node>
network:
  initiator:
    attachment: <decode-network-attachment>
    interface: net1
  target:
    attachment: <prefill-network-attachment>
    interface: net1
dimensions:
  threads: "1"         # client concurrency, independent of TP/DP
execution:
  namespace: <namespace>
  image: <registry>/kubernetes-cluster-bench:vllm-aisim
  image_pull_policy: IfNotPresent
  log_directory: logs
  runs: 1
  timeout_seconds: 600
  vllm:
    workload: dataset
    model: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    # Optional existing config/tokenizer directory; no weights are uploaded.
    # model_path: /path/to/Qwen--Qwen3-8B/b968826d9c46dd6066d109eabc6255188de91218
    timing: aisimulate
    timing_args: {gpu: h100, target_model: Qwen/Qwen3-8B}
    # Recorded alternatives: timing: table or replay, timing_args: {path: /path/to/steps.jsonl, k: 4}
    # Paths are hashed, staged to both pods and rewritten in server commands.
    clock: real
    kv_transfer_mode: real
    connector: nixl
    nixl_backend: mooncake  # mooncake, ucx, libfabric; omit for connector: mooncake
    prefill_tensor_parallel_size: 1
    decode_tensor_parallel_size: 1
    prefill_data_parallel_size: 1
    decode_data_parallel_size: 1
    # enable_expert_parallel: true  # required for supported MoE attention DP
    dtype: auto
    kv_cache_dtype: auto
    block_size: 16
    kv_cache_memory_bytes: 2147483648  # per rank, real CPU buffers
    max_model_len: 4096
    max_num_batched_tokens: 2048
    max_num_seqs: 32
    enable_prefix_caching: false
    kv_check: true  # fills prefill and checks decode; false disables both
    dataset_name: random
    num_prompts: 4
    request_rate: inf
    burstiness: 1.0
    seed: 0
    # input256 is nominally 36 layers * 16 blocks = 576 selected descriptors.
    # input512 selects 1152, above the reference NIXL/Mooncake 1024 guard.
    # Actual tokenized lengths, layouts and selections must still be checked.
    bench_args: {random-input-len: 256, random-output-len: 16, random-range-ratio: 0.0}
    # dataset_path: /path/to/file.jsonl  # local file/URL; for hf, its dataset id
    # hp_tcp_args: {}  # Mooncake paths only; omitting it uses native limits
    # env: {}          # managed binding/transport policy cannot be overridden
    profile_interval_seconds: 0.1
    profile_idle_seconds: 1.0
