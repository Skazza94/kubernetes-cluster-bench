backend: nixl
name: pirate-nixl

nodes:
  initiator: a100-03
  target: a100-04

dimensions:
  threads: 1:8
  block_size: 1K:8M
  batch_size: 1:8

execution:
  namespace: nwadekar-pirate
  image: quay.io/nwadekar/nixl-benchmark:og-nixl1.4.1-ucx1.22.0
  log_directory: logs
  timeout_seconds: 120
  keep_resources: false
  nixl:
    iterations: 100
    warmup_iterations: 10
